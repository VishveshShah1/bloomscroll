<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <!-- X / Twitter banner. Cream base, forest b on left, wordmark + tagline. -->
  <defs>
    <radialGradient id="bg1" cx="0.1" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#DDE7DA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F6F3EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="0.9" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#E8EDDE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F6F3EA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="#F6F3EA"/>
  <rect width="1500" height="500" fill="url(#bg1)"/>
  <rect width="1500" height="500" fill="url(#bg2)"/>

  <!-- b mark, centered-left, ~260px tall -->
  <g transform="translate(180 90)">
    <path d="M 169 77 L 169 294 C 169 405, 310 435, 329 349 C 344 278, 259 244, 222 290 C 197 321, 219 362, 254 357"
          stroke="#1E4D2B" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="scale(0.6)"/>
  </g>

  <text x="490" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="78" font-weight="600" letter-spacing="-2.5" fill="#12201A">bloomscroll</text>
  <text x="490" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="34" font-weight="500" letter-spacing="-1" fill="#5B6B5E">Keep scrolling.</text>
  <text x="490" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-1" fill="#1E4D2B">Start growing.</text>
</svg>
